<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Demo</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
      color: black;
    }

    .app-bar {
      background-color: blue;
      color: white;
      padding: 18px;
      font-size: 20px;
    }

    .container {
      height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h2 {
      font-size: 24px;
      font-weight: normal;
    }

    button {
      background-color: blue;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    .dark {
      background-color: #121212;
      color: white;
    }

    .dark .app-bar {
      background-color: #4527a0;
    }

    .dark button {
      background-color: #673ab7;
    }
  </style>
</head>

<body>

  <div class="app-bar">Theme Demo</div>

  <div class="container">
    <h2>Hello Flutter!</h2>

    <button onclick="changeTheme()" id="themeButton">
      Switch to Dark
    </button>
  </div>

  <script>
    let dark = false;

    function changeTheme() {
      dark = !dark;

      document.body.classList.toggle("dark", dark);

      document.getElementById("themeButton").textContent =
        dark ? "Switch to Light" : "Switch to Dark";
    }
  </script>

</body>
</html>
